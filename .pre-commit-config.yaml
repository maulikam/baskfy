# Optional: `pre-commit install`. See CONTRIBUTING.md.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c 'cd rust && cargo fmt --check'
        language: system
        files: ^rust/.*\.rs$
        pass_filenames: false
      - id: forbidden-files
        name: forbid archives, stale locks and env files
        entry: forbidden file
        language: fail
        files: (\.tgz$|\.lock-|(^|/)\.env(\..*)?$)
        exclude: (^|/)\.env(\.staging)?\.example$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=2048]
