# =============================================================================
# SENSEX Intraday Balanced-Premium Strangle — configuration
# Derived from config/strangle.yaml (NIFTY). PAPER ONLY.
#
# SENSEX IS A BSE CONTRACT. Options trade on BFO, not NFO, and the index quotes as
# BSE:SENSEX (token 265). Expiry is THURSDAY, weekly, with monthlies on the last
# Thursday — verified against the live dump on 18 Aug 2026: 2026-08-20, 08-27, 09-03,
# 09-10, 09-17, 09-24, all Thursdays. Nineteen contracts listed, so unlike BANKNIFTY
# this is a full weekly series and offers four tradeable sessions a week.
#
# The Thursday expiry is why calendar_nse.Calendar now takes a weekday parameter. Built
# with Tuesday — the old hardcoded value — SENSEX's three nearest expiries alone produce
# NINE invented holidays, including 25 Aug, which is a normal trading day and NIFTY's own
# expiry. That calendar would have refused startup on real sessions and mis-computed dte
# on the rest.
#
# POINT SCALING. SENSEX closed at 77,235 against NIFTY's 24,155 — 3.197x. Every
# points-denominated parameter is NIFTY's value times that ratio, so the targets ask for
# the same fractional move rather than the same absolute one.
# =============================================================================

meta:
  strategy: sensex_balanced_premium_strangle
  version: "2.1"
  mode: paper
  source: "Face2Face / Shreyas Bandi, 2021 — mechanically reconstructed, NOT validated"

instrument:
  underlying: "SENSEX"
  index_key: "BSE:SENSEX"
  exchange: BFO                   # [VERIFIED] BSE F&O segment, not NFO
  name: SENSEX
  lot_size: 20                    # [VERIFIED] every SENSEX option contract, 18 Aug 2026
  strike_step: 100                # [VERIFIED] modal gap across the live chain
  expiry_weekday: THURSDAY        # [VERIFIED] all nineteen listed expiries are Thursdays
  expiry_series: weekly
  holiday_rule: previous_trading_day

capital:
  total: 5000000
  cash: 2500000
  pledged_market_value: 2500000
  pledge_haircut_pct: 0.10
  enforce_cash_collateral_ratio: true

margin:
  # [VERIFIED] basket_order_margins on a 20-lot 1600-pt condor, 18 Aug 2026:
  # initial Rs 37,21,579 -> final Rs 18,63,047 = Rs 93,152/lot, hedge benefit 2.00x.
  # Within 1% of NIFTY's per-lot figure despite a 3.2x larger index — the margin is set
  # by notional, and the smaller lot size cancels the larger index almost exactly.
  max_utilisation_pct: 0.12            # this instrument's ALLOCATION of the account
  portfolio_max_utilisation_pct: 0.40  # the ACCOUNT ceiling, shared by all instruments
  margin_per_lot_estimate: 93200       # [CALIBRATE] sanity bound only; queried before entry
  query_before_every_entry: true
  abort_if_query_fails: true

sizing:
  lots: 6                                   # 0.12 * 47.5L usable / 93,152 = 6.1
  max_catastrophic_loss_pct: 0.15           # [STRUCTURAL]
  catastrophic_loss_denominator: capital_total
  max_lots_at_current_wing: 23              # 750,000 / (1600 * 20); do not hand-edit
  scale_by_session_multiplier: true
  never_increase_qty_after_entry: true      # [STRUCTURAL]
  loss_streak_multiplier: 0.75
  min_lots: 3
  win_streak_multiplier: 1.15
  max_lots_multiplier: 1.00                 # [STRUCTURAL]

structure:
  type: HEDGED
  wing_width_points: 1600         # 500 * 3.197, rounded to the 100-point strike step
  wing_widen_to: 2200
  max_wing_cost_pct: 0.20
  wing_width_invariant: true      # [STRUCTURAL]

session:
  stop_to_target_ratio: 0.50      # [STRUCTURAL] this ratio IS the edge. Do not fit it.
  allow_expiry_day: false
  max_dte: 4                      # weekly series never exceeds this; explicit, not implied
  by_days_to_expiry:              # [CALIBRATE] NIFTY's points * 3.197
    "3+": {target_points: 16, size_mult: 0.50}
    "2":  {target_points: 22, size_mult: 0.75}
    "1":  {target_points: 32, size_mult: 1.00}
    "0":  {target_points: 32, size_mult: 0.60}
  reject_negative_dte: true
  min_stop_to_entry_cost_ratio: 2.0
  extra_holidays: []

timing:
  premarket_setup: "09:00"
  entry_early: "09:15"
  entry_normal: "09:30"
  entry_window_end: "09:45"
  allow_late_entry: true
  late_entry_size_mult: 0.75
  no_new_entry_after: "12:30"
  force_exit: "15:10"

levels:
  swing_timeframe: "1h"
  swing_lookback_days: 10
  swing_left_bars: 2
  swing_right_bars: 2
  swing_recency_lambda: 0.05
  cluster_tolerance_points: 160   # 50 * 3.197
  use_unconfirmed_candle: false   # [STRUCTURAL]

priced_range:
  multiplier: 1.0                 # [STRUCTURAL]

open_interest:
  snapshot_interval_seconds: 180
  lookback_minutes: 30
  min_oi_percentile: 70
  treat_as_filter_not_truth: true

gates:
  gap_veto_pct: 0.0125
  iv_low_multiplier: 0.85
  iv_high_multiplier: 1.30
  # Scaled by lot size (20 vs 65) so the floor means a comparable number of CONTRACTS
  # rather than a comparable number of units. SENSEX carries less OI than NIFTY in
  # absolute terms and a copied 500k floor would veto nearly every session.
  min_leg_oi: 150000
  max_bid_ask_spread_pct: 0.03
  max_data_staleness_seconds: 5
  require_secondary_broker: true
  max_consecutive_loss_days: 3
  event_blacklist: [rbi_policy, union_budget, fed_fomc, cpi_india, election_result]

reference_band: {}                # [CALIBRATE] ships empty on purpose
reference_band_required_in_paper: true

entry_timing_gate:
  same_or_higher_than_prev_close: 1.00
  min_fraction_of_prev_close: 0.90

selection:
  min_strikes_beyond_priced_range: 1
  min_leg_premium: 26             # 8 * 3.197
  premium_balance_tolerance_pct: 0.10   # [STRUCTURAL] balance by PREMIUM, not distance
  must_be_beyond_oi_wall: true
  must_be_beyond_swing_level: true

management:
  poll_seconds: 5
  rebalance_ratio: 1.25
  min_adjustment_interval_minutes: 5
  max_adjustments_per_day: 3
  rebalance_allowed_above_pct_of_stop: -0.85
  break_confirmation_closes: 2
  break_confirmation_timeframe: "1m"
  risk_on: {match_premium_multiplier: 1.00, trending_day_multiplier: 1.05,
            min_fill_fraction: 0.90}
  risk_off: {trigger_at_pct_of_stop: 0.60, min_premium_reduction_pct: 0.25}
  vwap_filter: {enabled: true, never_riskoff_threatened_leg: true,
                both_above_vwap_action: EXIT}

exits:
  hard_stop_ends_day: true        # [STRUCTURAL]
  trail_trigger_pct: 0.80
  trail_give_back_points: 6.4     # 2.0 * 3.197
  trail_ratchets_off_high_water_mark: true
  widen_legs_on_trail_activation: true
  widen_min_premium_fraction: 0.50
  target_overrun_multiplier: 1.5
  proximity_abort_asp_fraction: 0.60
  efficiency_abort_window: ["12:00", "12:30"]
  efficiency_abort_pct_of_target: 0.30
  efficiency_abort_no_improvement_minutes: 20
  premium_exhausted_pct_of_credit: 0.15
  allow_single_reentry: true
  reentry_min_extra_strikes: 2
  reentry_min_target_points: 12.8 # 4.0 * 3.197
  reentry_stop_ratio: 0.50        # [STRUCTURAL]

fills:
  mode: depth_walk                # [STRUCTURAL] never LTP, never mid
  sell_at: BID
  buy_at: ASK
  walk_depth_levels: 5
  refuse_if_depth_unavailable: true
  queue_position_penalty_ticks: 1
  tick_size: 0.05
  slice_above_lots: 10
  abort_slices_if_slippage_points: 6.4

costs:
  # STT, SEBI, stamp duty, IPFT and GST are statutory and identical on BSE.
  #
  # exchange_txn_pct IS THE ONE NUMBER IN THIS FILE THAT IS NOT VERIFIED. It carries NSE's
  # rate as a placeholder. BSE sets its own derivatives transaction charge and has revised
  # it more than once while competing for SENSEX option volume. This rate feeds the
  # entry-cost gate (session.min_stop_to_entry_cost_ratio), so if it is wrong the gate is
  # calibrated wrong in the permissive direction. Confirm against a real SENSEX options
  # contract note before this instrument goes anywhere near live, and correct it here.
  brokerage_per_order: 20
  stt_sell_pct: 0.0015
  exchange_txn_pct: 0.0003553     # [UNVERIFIED — NSE's rate; see the note above]
  sebi_fee_pct: 0.000001
  stamp_duty_buy_pct: 0.00003
  ipft_pct: 0.000005
  gst_pct: 0.18
  assumed_entry_exit_points: 2.9
  assumed_points_per_adjustment: 1.6
  planning_case_points: 6.1

accounting:
  mark_basis: liquidation
  book_pnl_is_net_of_costs: true
  realised_legs_already_net: true

operational:
  secondary_broker_required: true
  heartbeat_seconds: 10
  heartbeat_max_misses: 3
  kill_switch_multiple_of_stop: 2.0
  lockout_persists_to_disk: true
  basket_orders_only_on_exit: true
  journal_path: "data/outputs/strangle_sensex_journal.jsonl"
  lockout_path: "data/outputs/strangle_sensex_lockout.json"
  journal_append_only: true

live:
  enabled: false
  require_typed_confirmation: true
  min_paper_sessions_before_live: 60
  require_expectancy_within_tolerance: true
