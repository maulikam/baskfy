# Continuous WAL archiving — docs/11 §Reliability: "nightly `pg_dump` + continuous WAL archiving
# to R2". PROMPTS.md Prompt 17 deliverable 6.
#
# Include this from postgresql.conf (`include = '/etc/postgresql/wal-archive.conf'`) or append it.
# A restart is required for `wal_level` and `archive_mode`; the rest reload.
#
# WHAT THIS BUYS, on top of the nightly dump
# -------------------------------------------
# `pg_backup.sh` gives you last night. WAL archiving gives you any moment since last night, which
# is the difference between "we lost a day" and "we lost four minutes" — and, more usefully, it is
# what makes `docs/runbooks/bad-data-published.md`'s worst case survivable: restore the base backup
# and replay to the second *before* the bad publish, rather than to whenever the dump happened.
#
# NOTE THAT NONE OF THIS HAS RUN. This file is written from the PostgreSQL 16 documentation, not
# from a working deployment. `docs/runbooks/restore-from-backup.md` says so at the top, and the
# first thing to do on a real host is `SELECT pg_switch_wal();` and confirm a segment appears in
# the bucket.

# Required for archiving at all. `replica` is enough; `logical` costs more WAL volume and buys
# nothing here (docs/03 §"Scaling plan" step 2 wants a read replica, which `replica` also serves).
wal_level = replica
archive_mode = on

# The archive command. Three properties matter and each is easy to get wrong:
#
#   1. It must FAIL when the upload fails. PostgreSQL only recycles a WAL segment after
#      archive_command exits 0; a command that exits 0 on a failed upload silently discards WAL and
#      the archive develops a hole nobody notices until a restore stops at it.
#   2. It must REFUSE to overwrite. `aws s3 cp` will happily overwrite an existing key, and a
#      re-archived segment with different contents makes the archive unreplayable. The `ls` guard
#      below is the check; on a bucket with object-lock or `--if-none-match` support, use that
#      instead — it is atomic and this is not.
#   3. It must be fast enough. The default `archive_timeout` forces a segment switch every so
#      often; a slow command backs WAL up in pg_wal until the volume fills.
#
# %p is the path to the segment, %f its bare name.
archive_command = '/usr/local/bin/baskfy-archive-wal.sh %p %f'

# Force a segment switch at least this often, so a quiet database still has a recent recovery
# point. 60s of WAL is the most this deployment can lose to a total host failure between switches.
archive_timeout = 60s

# Keep enough WAL locally that a brief archive outage does not wedge the primary.
max_wal_size = 4GB
min_wal_size = 1GB

# --- The archive command itself -------------------------------------------------------------
# Install as /usr/local/bin/baskfy-archive-wal.sh, chmod +x, owned by the postgres user:
#
#   #!/usr/bin/env bash
#   set -euo pipefail
#   SRC="$1"; NAME="$2"
#   KEY="wal/${NAME}"
#   # (2) refuse to overwrite. Not atomic — see above.
#   if aws --endpoint-url "${R2_ENDPOINT}" s3 ls "s3://${R2_BUCKET}/${KEY}" >/dev/null 2>&1; then
#     echo "archive-wal: ${KEY} already exists; refusing to overwrite" >&2
#     exit 1
#   fi
#   # (1) `set -e` plus aws's own non-zero exit is what makes a failed upload a failed archive.
#   aws --endpoint-url "${R2_ENDPOINT}" s3 cp "${SRC}" "s3://${R2_BUCKET}/${KEY}"
#
# --- Recovery -------------------------------------------------------------------------------
# On the restore target, in postgresql.conf, with a `recovery.signal` file present:
#
#   restore_command = 'aws --endpoint-url "${R2_ENDPOINT}" s3 cp s3://${R2_BUCKET}/wal/%f %p'
#   recovery_target_time = '2026-08-21 19:45:00+05:30'   # IST; the moment before the bad publish
#   recovery_target_action = 'promote'
#
# docs/runbooks/restore-from-backup.md walks the whole sequence.
