# Phase A — the whole product on one EC2 box, per `docs/08-aws-architecture.md` §3.
#
#     docker compose -f infra/docker/compose.prod.yml --env-file .env.staging up -d
#
# This is deliberately the same topology as Phase B, one layer down: the same containers, the same
# environment contract, the same queue split. §2 calls that "what makes the second phase a
# re-plumbing, not a rewrite" — postgres becomes RDS, redis becomes Valkey, caddy becomes ALB, and
# no application code changes.
#
# WHAT IS NOT HERE
# ----------------
# mailpit, prometheus and grafana. `compose.yml` (development) keeps them; §3 gives Phase A
# "compose --profile observability as built", which is a deliberate second step, not this file's
# job. Adding them here would put two unauthenticated dashboards on a box that reaches the order
# path.

# Distinct from `compose.yml`'s `baskfy`. Same project name means Docker treats the two files as
# one stack: bringing this up beside the development stack merged them, and mailpit — which this
# file deliberately excludes — appeared in `ps` as part of the deployment.
name: baskfy-staging

x-python-image: &python-image
  image: ${BASKFY_PY_IMAGE:-baskfy-py:local}
  restart: unless-stopped
  # Relative to THIS file, always. The first version pointed at ../../../.env.staging, which is
  # correct only when the compose file is read from `infra/docker/` inside a checkout — on the box
  # it lives in /opt/baskfy and that path resolved to `/`. Keeping the env file beside the compose
  # file makes the two layouts identical; the repo checkout gets a symlink (see the Makefile
  # target and tools/deploy/bootstrap-local.sh).
  env_file: [.env.staging]
  volumes:
    # The raw-file archive docs/09 requires before anything is parsed: "Never re-fetch to
    # re-parse: the archive is the reproducibility record."
    #
    # Without this the archive root defaults to a *relative* `.archive`, which resolves against
    # the image's root-owned `/repo` — so every NSE fetch died at the archive step with
    # `Permission denied` before it could parse a row, and the whole bhavcopy path was down on
    # this box. It went unnoticed because nobody had run an NSE ingest here.
    - baskfy-archive:/var/lib/baskfy/archive
    # The Kite session bridge (M58). Read-only, and deliberately from the host rather than the
    # image: a private key baked into an image is a private key in every registry that ever
    # pulls it. Holds `kite-session` (the key) and `known_hosts` (the desk's pinned host key);
    # both paths are `ProviderSettings` defaults, so nothing else needs configuring.
    #
    # Created by tools/deploy/install-kite-session.sh, owned by uid 1001 — the container's
    # `baskfy` user. ssh refuses a key it considers world-readable, and refuses one it cannot
    # read at all, so the ownership is load-bearing rather than tidiness.
    - /opt/baskfy/secrets/ssh:/var/lib/baskfy/.ssh:ro
    # The encrypted Kite token. A named volume because it must outlive a container and be the
    # same file for worker, ingest-worker and beat — and because the setting's default is the
    # *relative* `.secrets/kite-token.enc`, which resolves against the image's root-owned `/repo`
    # and cannot be written. That is the same failure that silently disabled the whole NSE
    # archive path until 27 Aug; naming it here is what stops it recurring for the token.
    - baskfy-state:/var/lib/baskfy/state
  environment:
    # docs/08 §1: the whole schedule is IST wall-clock tied to the NSE session.
    TZ: Asia/Kolkata
    # VB13 — the volume-breakout sleeve's two flags, named HERE and not only in the env file.
    #
    # The desk block below says why at length, and it applies with more force to a sleeve that
    # has never traded: **a variable this file does not name never reaches the container.** Until
    # 11 Sep 2026 neither of these was named anywhere in this file, so the sleeve ran on its code
    # defaults — which happen to be the safe ones, and which nobody could have verified by
    # reading the box.
    #
    # `..._EXECUTION_ENABLED` false is the rail: with it false a confirmed VBT line runs the whole
    # gateway path and journals `simulated=true`, whatever DRY_RUN says. Only Maulik sets it, by
    # hand, and no agent may (NEEDS-MAULIK V3, answered 11 Sep 2026).
    #
    # `..._NIGHTLY_ENABLED` defaults **true** and that is not an inconsistency: detection writes
    # `vb_signal_daily` and `vb_breadth_daily`, moves no money, and a sleeve with no history is a
    # sleeve with no evidence for the gate above it.
    BASKFY_VBT_EXECUTION_ENABLED: "${BASKFY_VBT_EXECUTION_ENABLED:-false}"
    BASKFY_VBT_NIGHTLY_ENABLED: "${BASKFY_VBT_NIGHTLY_ENABLED:-true}"
    # Where the nightly pipeline borrows a Kite session from. Empty would disable the pull; the
    # day's bars would still arrive from the bhavcopy, but history and holdings would not.
    BASKFY_KITE_DESK_SSH_TARGET: ${BASKFY_KITE_DESK_SSH_TARGET:-desk@65.0.226.77}
    BASKFY_KITE_TOKEN_PATH: /var/lib/baskfy/state/kite-token.enc
    BASKFY_RAW_ARCHIVE_DIR: /var/lib/baskfy/archive
    # KITE'S CEILING, AND THE LANE UNDER IT (M85).
    #
    # Kite states two limits and the tighter one governs: per endpoint it is 1 req/s for
    # /quote-family calls and 3 req/s for historical, but ACROSS ALL ENDPOINTS COMBINED it is
    # 3 HTTP requests a second, and the fourth is an HTTP 429. Every Kite read on this box —
    # api, worker, ingest-worker, beat and the desk — waits on one Redis departure clock at
    # this rate, so the number below is the box's whole allowance and not each container's.
    #
    # The bulk rate is what a *backfill* may spend of it. It exists because Maulik logs in at
    # 1pm: the login starts a missed-session catch-up (an hour of historical_data) and, beside
    # it, the holdings read and today's live swing scan that he is actually waiting for. With
    # one clock and no lane the interactive reads queue behind the whole hour. Held at 2 of the
    # 3, the shared clock is drained faster than the backfill fills it and ~1 req/s stands free.
    # These are the ProviderSettings defaults, stated here so this file still tells the truth.
    BASKFY_KITE_RATE_LIMIT_PER_SECOND: "${BASKFY_KITE_RATE_LIMIT_PER_SECOND:-3}"
    BASKFY_KITE_BULK_RATE_LIMIT_PER_SECOND: "${BASKFY_KITE_BULK_RATE_LIMIT_PER_SECOND:-2}"
    BASKFY_DATABASE_URL: postgresql+asyncpg://baskfy:${BASKFY_DB_PASSWORD:?set BASKFY_DB_PASSWORD}@postgres:5432/baskfy
    BASKFY_REDIS_URL: redis://redis:6379/0
    # Root CLAUDE.md, non-negotiable 1 and the safety rails. Stated here as well as baked into the
    # image so that reading this file tells you the truth about the box.
    #
    # Parameterised, default UNCHANGED at "true": a fresh deployment is still dry by default and
    # reading this file still tells you the truth. Overriding it is now an explicit line in the
    # env file rather than a hand-edit of this one, so the box cannot silently diverge from git —
    # which is how the Caddyfile drifted (DECISIONS-MERGE, leaf 1.1.5).
    #
    # What DRY_RUN=false actually unlocks in Baskfy, measured 1 Sep 2026 before flipping it:
    # ONE read-only capability, Kite's `GET /portfolio/holdings` via `broker_holdings.py`.
    # It cannot reach an order: `services/api` contains zero `.place(` / `place_order` /
    # `place_gtt` calls, `routers/kite.py` has zero POST routes, and the only two POSTs under
    # /brokers are OAuth-start (D3-gated) and sync-holdings (read-only).
    #
    # THE SECOND LOCK DESCRIBED HERE IS GONE, AND THAT WAS DELIBERATE (M74 corrects the comment).
    # This used to add "and a live token exchange stays blocked by an absent
    # BASKFY_KITE_API_SECRET, which must stay absent because the desk redeems the request_token".
    # M70-M73 moved the Kite login to Baskfy at Maulik's instruction, and the Connect button
    # cannot redeem a request_token without that secret — so it is now SET on the box and the
    # desk, not Baskfy, is the side that lost its session. Re-verified 1 Sep 2026: the no-order
    # property does not rest on that secret. It rests on there being no code path at all —
    # `services/api` still has zero `.place(` / `place_order` / `place_gtt` calls, `routers/kite.py`
    # still has zero POST routes, and no execute route exists (D3-E authorises one; it is unbuilt
    # and its flag is off). Check those four things, not the secret, before trusting this.
    DRY_RUN: "${BASKFY_DRY_RUN:-true}"
    BASKFY_PUBLIC_API_ENABLED: "false"
    BASKFY_FREE_TIER_ENABLED: "false"
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  # ------------------------------------------------------------------ edge
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    # Overridable so the stack can be verified on a laptop that already has something on 80.
    # On the box these are 80 and 443 and nothing else is listening.
    ports:
      - "${BASKFY_HTTP_PORT:-80}:80"
      - "${BASKFY_HTTPS_PORT:-443}:443"
      - "${BASKFY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # certificates and ACME account — losing this re-issues, so it is a volume
      - caddy-config:/config
    environment:
      BASKFY_SITE_ADDRESS: ${BASKFY_SITE_ADDRESS:?set BASKFY_SITE_ADDRESS}
      BASKFY_ACME_EMAIL_DIRECTIVE: ${BASKFY_ACME_EMAIL_DIRECTIVE:-}
      BASKFY_ACME_CA_DIRECTIVE: ${BASKFY_ACME_CA_DIRECTIVE:-}
      BASKFY_GATE_USER: ${BASKFY_GATE_USER:?set BASKFY_GATE_USER}
      # A bcrypt hash always contains `$` (`$2a$14$…`), and Compose interpolates `$` in values
      # read from an env file — the hash arrived at Caddy with its salt eaten and every login
      # failed. Escape each `$` as `$$` in the env file; `tools/deploy/gate-password.sh` does it
      # for you and is the only supported way to generate this.
      BASKFY_GATE_PASSWORD_HASH: ${BASKFY_GATE_PASSWORD_HASH:?set BASKFY_GATE_PASSWORD_HASH — bcrypt with $$-escaping, from tools/deploy/gate-password.sh}
      # The desk's own vhost (SW13, MD20): `desk.<main host>` by default, so on the box it is
      # desk.staging.baskfy.com with the same ACME account and the same headers. The local smoke
      # overrides it to `http://desk.localhost` — a scheme-qualified address is how Caddy is told
      # not to obtain a certificate for it.
      BASKFY_DESK_SITE_ADDRESS: ${BASKFY_DESK_SITE_ADDRESS:-desk.${BASKFY_SITE_ADDRESS}}
    # `desk` is deliberately NOT a dependency: Caddy resolves `desk:8420` per request and answers
    # 502 on that vhost while the desk is down, whereas a depends_on would keep the whole edge —
    # and the main site — from starting the day the desk image fails to pull.
    depends_on: [web, api]

  # ------------------------------------------------------------------ app
  web:
    image: ${BASKFY_WEB_IMAGE:-baskfy-web:local}
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      NODE_ENV: production
      # The whole point of the split horizon: server rendering talks to the API across the
      # container network and never meets Caddy's password. See `lib/api/config.ts`.
      BASKFY_INTERNAL_API_ORIGIN: http://api:8000
      BASKFY_ENVIRONMENT: staging
      BASKFY_JWT_SECRET: ${BASKFY_JWT_SECRET:?set BASKFY_JWT_SECRET}
      BASKFY_JWT_ISSUER: ${BASKFY_JWT_ISSUER:-baskfy}
      BASKFY_JWT_AUDIENCE: ${BASKFY_JWT_AUDIENCE:-baskfy-web}
      # BASKFY_RELEASE is deliberately NOT set here. `Dockerfile.web` bakes it at build time from
      # `push-images.sh`'s `--build-arg BASKFY_RELEASE=$(git rev-parse --short HEAD)`, so the image
      # already knows which commit it is. This line used to read `${BASKFY_RELEASE:-dev}`, and
      # since nothing sets that variable in `.env.staging.compose` it resolved to `dev` on every
      # deploy — a runtime default silently clobbering a correct build-time value.
      #
      # The cost was not cosmetic: "which commit is actually running?" is the first question of
      # every deploy verification, and the box answered `dev` to it. Twice this session that had
      # to be established by comparing image digests by hand instead.
      NEXTAUTH_URL: ${BASKFY_PUBLIC_URL:?set BASKFY_PUBLIC_URL}
      AUTH_SECRET: ${BASKFY_JWT_SECRET}
      AUTH_TRUST_HOST: "true"
      # Google sign-in (M46). Both values, because this container runs the OAuth code exchange.
      #
      # THEY HAVE TO BE LISTED HERE. This service is the one that does NOT take `env_file:
      # [.env.staging]` — the python services get that through the `x-python-image` anchor, and
      # this block is the whole of the web container's environment. A value added to
      # `.env.staging` and nowhere else reaches the API and never reaches Auth.js, which fails as
      # "Google sign-in is misconfigured" on a box where the setting is visibly present.
      #
      # `:-` and not `:?`, deliberately, and it is the opposite of the choice made for
      # `BASKFY_JWT_SECRET` above. An unset secret means nothing can be verified and the stack
      # should refuse to start. An unset Google client means *sign-in* is broken while the
      # marketing pages and the four legal documents still serve — and those are what Google's own
      # OAuth verification fetches, so taking the site down over a missing sign-in credential
      # would break the thing that fixes it. `Settings.require_configured` still refuses an empty
      # client id outright in production, where the trade runs the other way.
      #
      # NOT server-side-inlined at build time: these are read by the Auth.js config on the server,
      # not by the client bundle, so they are a restart rather than a rebuild.
      BASKFY_GOOGLE_CLIENT_ID: ${BASKFY_GOOGLE_CLIENT_ID:-}
      BASKFY_GOOGLE_CLIENT_SECRET: ${BASKFY_GOOGLE_CLIENT_SECRET:-}
    # NEXT_PUBLIC_* is absent on purpose: it is inlined at build time, so setting it here would
    # change nothing and read as if it had. It lives in the image's build args.
    expose: ["3000"]
    depends_on:
      api: {condition: service_started}

  api:
    <<: *python-image
    command:
      - uvicorn
      - baskfy_api.app:get_app
      - --factory
      - --host=0.0.0.0
      - --port=8000
      # One worker. Phase A is one user (§2), the workload is IO-bound against Postgres, and a
      # second worker would double the connection pool for no measurable gain. Phase B scales by
      # task count, not by process count.
      - --workers=1
      - --proxy-headers
      - --forwarded-allow-ips=*
    expose: ["8000"]
    healthcheck:
      # `/health` is at the app root, NOT under API_PREFIX, and it deliberately does not
      # touch Postgres — app.py: "A health check that fails when PostgreSQL is briefly
      # unreachable takes the process out of the load balancer at the exact moment it would
      # have recovered on its own."
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # docs/08 §5: "the four Celery queues split across two services so a slow Kite night still
  # cannot starve compute". Phase A runs both roles, still split, so the split is exercised long
  # before it matters.
  worker:
    <<: *python-image
    command:
      - celery
      - -A
      - baskfy_worker.celery_app:app
      - worker
      - -Q
      - compute,backtest,default
      - -l
      - info
      - --concurrency=2

  ingest-worker:
    <<: *python-image
    command:
      - celery
      - -A
      - baskfy_worker.celery_app:app
      - worker
      - -Q
      - ingest
      - -l
      - info
      # One. Kite's floor is ~3 req/s and the providers rate-limit themselves; extra concurrency
      # here only queues up behind the same limiter while holding more connections.
      - --concurrency=1

  beat:
    <<: *python-image
    command:
      - celery
      - -A
      - baskfy_worker.celery_app:app
      - beat
      - -l
      - info
      # Explicit, and on a volume. Beat defaults to `./celerybeat-schedule` in the working
      # directory, which is root-owned in this image — it crash-looped on EACCES until this was
      # added. Persisting it also matters on its own: a Beat that loses this file treats every
      # schedule as never-run and re-fires the whole nightly chain on the next restart.
      - --schedule=/var/lib/baskfy/celerybeat-schedule
      - --pidfile=
    volumes:
      - baskfy-beat:/var/lib/baskfy
    # Celery's own docs: exactly one Beat, ever. Two would double every scheduled job — including
    # the nightly chain and the publish check.
    deploy:
      replicas: 1

  # ------------------------------------------------------------------ the desk (SW13, MD20)
  # The merged operator console — weekly momentum book and swing book — on the same Postgres
  # (schema `desk`, DESK_DB_BACKEND=postgres) and the same Kite token store as api/worker/beat.
  # Reached only through Caddy at desk.<host>, behind the desk's own basic auth (DESK_PASSWORD;
  # app/core/websec.py). `x-python-image` is not reused: the env file and the token volume are
  # shared, the image and the command are not.
  desk: &desk
    image: ${BASKFY_DESK_IMAGE:-baskfy-desk:local}
    restart: unless-stopped
    env_file: [.env.staging]
    volumes:
      # READ-ONLY. The api/worker write the encrypted token after the morning login (M74); the
      # desk reads it at start-up and must not be able to write, rotate or delete it. A Kite
      # request_token is single-use, so there is exactly one redeemer and one store.
      - baskfy-state:/var/lib/baskfy/state:ro
      # Everything the desk writes under its tree: retained scan uploads, ops job logs. Not the
      # book — that is Postgres — and never a token.
      - desk-data:/desk/data
    environment:
      TZ: Asia/Kolkata
      DESK_DB_BACKEND: postgres
      DESK_DB_SCHEMA: desk
      DESK_DATABASE_URL: postgresql://baskfy:${BASKFY_DB_PASSWORD:?set BASKFY_DB_PASSWORD}@postgres:5432/baskfy
      # SW21: the box's read limiter. This service and `swing-monitor` below are two processes
      # with two `Kite` objects, and Kite's read caps are per API key — so without this each held
      # its own spacers and the two could together exceed the 1 req/s quote cap. With it, both
      # queue behind one departure clock per endpoint family under `baskfy:ratelimit:kite:*`, in
      # the same Redis the api and the worker already use (the `*python-image` anchor above).
      #
      # DELIBERATELY NOT A `depends_on`. The desk degrades to per-process spacers when Redis does
      # not answer, logs it, and retries once a minute — whereas a `service_healthy` condition
      # would mean an unhappy Redis could stop the desk from starting at all, and the desk must be
      # able to rebalance on any Friday (root CLAUDE.md). `GET /status` reports which mode it is
      # in, so a deploy verifies the wiring rather than assuming it.
      BASKFY_REDIS_URL: redis://redis:6379/0
      TOKEN_FILE: /var/lib/baskfy/state/kite-token.enc
      # The desk's Host check (websec.py) refuses any name not listed here: Caddy's vhost, plus
      # loopback for the healthcheck. `desk` is the compose-network name, for `curl` from a
      # sibling container.
      DESK_ALLOWED_HOSTS: "127.0.0.1,localhost,desk,${BASKFY_DESK_HOST:-desk.${BASKFY_SITE_ADDRESS}}"
      DESK_PORT: "8420"
      DESK_DOCS: "false"
      # From the box's compose env file (`.env.staging.compose`), generated there by
      # tools/deploy/deploy-swing.sh if absent — the same place the gate hash and the JWT secret
      # live, and never an argument to box.sh. Any username; only the password is checked.
      DESK_PASSWORD: ${BASKFY_DESK_PASSWORD:?set BASKFY_DESK_PASSWORD in .env.staging.compose (tools/deploy/deploy-swing.sh generates it on the box)}
      # Blanked on purpose, even if the env file carries the desk's copy: with no secret the
      # desk's /callback cannot redeem a request_token, so it can never race Baskfy for the
      # single-use token. The key and the token-encryption key are mapped by the entrypoint.
      KITE_API_SECRET: ""
      # The safety rails, stated here so this file tells the truth about the box (root
      # CLAUDE.md; docs/swing/02 §3). DRY_RUN is the weekly book's; the four BASKFY_SWING_*
      # flags are the swing book's, each independent, each false. `environment:` beats
      # `env_file:`, so a value in `.env.staging` cannot flip any of them for this container —
      # the process that can reach an order. The only override is a line in
      # `.env.staging.compose` (compose interpolation), written by Maulik's hand; api/worker/beat
      # read their copies of the swing flags from `.env.staging`, so a live flip is two
      # deliberate lines, not one.
      #
      # ITS OWN VARIABLE, NOT THE API'S (SW13-run). The api's `BASKFY_DRY_RUN` is `false` on the
      # box since M81/M82 — it unlocks one read-only holdings pull and nothing else (see the
      # api block above). The desk's DRY_RUN gates real order placement, so it must not ride the
      # same line: sharing `${BASKFY_DRY_RUN}` would have started the desk live the first time
      # it was deployed. `BASKFY_DESK_DRY_RUN` is unset on the box; the default is the rail.
      DRY_RUN: "${BASKFY_DESK_DRY_RUN:-true}"
      BASKFY_SWING_EXECUTION_ENABLED: "${BASKFY_SWING_EXECUTION_ENABLED:-false}"
      BASKFY_SWING_MONITOR_ENABLED: "${BASKFY_SWING_MONITOR_ENABLED:-false}"
      # SW25 — AUTO-EXECUTE: the monitor confirms its own triggers, with nobody watching.
      #
      # The switch that removes the desk's first non-negotiable. A real unattended order needs
      # ALL THREE of DRY_RUN=false, BASKFY_SWING_EXECUTION_ENABLED=true and this; the desk's
      # `auto_execute_enabled()` is the AND of them. Stated here as well as in the env file
      # because a variable this file does not name never reaches the container at all — setting
      # it in `.env.staging.compose` alone would look like going unattended and do nothing.
      # `swing-monitor` inherits this whole block through `<<: *desk`, so the process that
      # actually fires the orders and the page that shows them read the same value.
      BASKFY_SWING_AUTO_EXECUTE: "${BASKFY_SWING_AUTO_EXECUTE:-false}"
      BASKFY_SWING_EP_PREMARKET_ENABLED: "${BASKFY_SWING_EP_PREMARKET_ENABLED:-false}"
      # VB13 — the volume-breakout sleeve on the desk. `BASKFY_VBT_EXECUTION_ENABLED` is the
      # switch that lets a confirmed VBT line reach a broker, and it is **deliberately
      # independent of DRY_RUN and of every BASKFY_SWING_* above**: going live and turning this
      # sleeve on are separate decisions and either can be reversed without the other.
      #
      # THERE IS NO BASKFY_VBT_AUTO_EXECUTE, here or anywhere. Non-negotiable 1's named exception
      # belongs to the swing sleeve alone; this sleeve confirms every order by hand, one click per
      # line, and `tests/test_vbt_safety.py` asserts across both trees that no setting of that
      # shape exists.
      BASKFY_VBT_EXECUTION_ENABLED: "${BASKFY_VBT_EXECUTION_ENABLED:-false}"
      BASKFY_SWING_TIMING_PROBE: "${BASKFY_SWING_TIMING_PROBE:-false}"
      # BASKFY_SOLE_USER_ID / BASKFY_SOLE_BROKER_ACCOUNT_ID (P4.3, the tenant pair every order
      # carries) come from `.env.staging` through env_file, exactly as the api reads them —
      # deliberately not restated here, where a compose default would shadow the file's value.
      INTRADAY_ENABLED: "false"
      OPTIONS_ENABLED: "false"
    expose: ["8420"]
    healthcheck:
      # /status is the one route websec.py answers without the password. It reports dry_run and
      # whether a Kite session exists; it never touches an order.
      test: ["CMD", "curl", "-fsS", "http://localhost:8420/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      postgres: {condition: service_healthy}

  # The opening-range monitor as its own process (docs/swing/06 SW6): the image's
  # `swing-monitor-loop` sleeps until 09:14 IST on a weekday, runs `python -m app.swing_monitor`,
  # and sleeps to the next weekday. With BASKFY_SWING_MONITOR_ENABLED=false (the default above)
  # the monitor exits 0 without constructing the strategy and the loop idles — so this service
  # can exist before the flag does. Same image, same env, same read-only token, no port.
  swing-monitor:
    <<: *desk
    command: [swing-monitor-loop]
    expose: []
    healthcheck:
      disable: true

  # One-shot. Not started by `up`; run explicitly before a deploy switches traffic:
  #     docker compose -f infra/docker/compose.prod.yml run --rm migrate
  # A profile rather than a `depends_on`, because a migration that runs on every container restart
  # is a migration that runs during an outage, on a box that is already unhappy.
  migrate:
    <<: *python-image
    profiles: [tools]
    restart: "no"
    working_dir: /repo/services/api
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}

  # One-shot, and the step this file was missing. Run it after `migrate`, before traffic:
  #     docker compose -f infra/docker/compose.prod.yml run --rm seed
  #
  # WHY THIS EXISTS (M48)
  # A migrated database is an *empty* database. Every table that holds reference data — `plan`,
  # `cb_collection`, universes, the factor registry — is populated by `baskfy_api.seed`, and
  # nothing in the deploy sequence ran it. The visible result on 27 Aug 2026 was `/pricing`
  # rendering its preamble and no plan cards at all (`GET /plans` returned `{"data":[]}`), and
  # `/discover/collections` rendering an empty directory. Both read as broken pages; both were an
  # empty table under a working page.
  #
  # `seed all` is idempotent by design (house rule 7: "re-running any day's job produces identical
  # rows"), so running it on every deploy is safe and is the intended habit. A profile rather than
  # a `depends_on` for the same reason `migrate` is one.
  seed:
    <<: *python-image
    profiles: [tools]
    restart: "no"
    working_dir: /repo/services/api
    # `reference`, not `all`. `all` additionally loads the 271-row reference export from
    # `tests/fixtures/`, which is **deliberately not in the production image** — it is a test
    # answer key of random-walk bars, and shipping it to a box that holds real closes would be
    # worse than not seeding at all. On the box it fails outright:
    #     FileNotFoundError: reference-screen-export-2026-08-18.csv not found
    #
    # `reference` is the branch that holds the data a deployment actually needs and cannot derive:
    # the exchange, the index definitions, the three plans, the example screens, the curated
    # managers and the collection shelves. Everything else — bars, factors, baskets — comes from
    # the pipeline against real data, which is where it should come from.
    command: [python, -m, baskfy_api.seed, reference]
    depends_on:
      postgres: {condition: service_healthy}

  # ------------------------------------------------------------------ data
  postgres:
    # §3: "Keep the Timescale container image in Phase A ... The Timescale exit happens once, at
    # P3.9, into RDS (§4)." Same pin as the development compose, so dev and staging agree.
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: baskfy
      POSTGRES_PASSWORD: ${BASKFY_DB_PASSWORD:?set BASKFY_DB_PASSWORD}
      POSTGRES_DB: baskfy
      TZ: Asia/Kolkata
    volumes:
      - baskfy-pgdata:/var/lib/postgresql/data
    # Not published to the host. The nightly pg_dump runs `docker compose exec`, and an exposed
    # 5432 on a public EIP is the single most-scanned port on the internet.
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baskfy -d baskfy"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - baskfy-redisdata:/data
    expose: ["6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  baskfy-archive: {}
  baskfy-state: {}
  desk-data: {}
  baskfy-pgdata:
  baskfy-redisdata:
  baskfy-beat:
  caddy-data:
  caddy-config:
