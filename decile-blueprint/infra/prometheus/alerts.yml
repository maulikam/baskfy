# Prometheus alerting rules — PROMPTS.md Prompt 17 deliverable 3.
#
#   "Alerting rules: pipeline failure, Kite token expiry, gate failure, publish later than
#    20:15 IST, error rate > 1%, queue backlog."
#
# Every metric referenced here is defined in `services/api/src/baskfy_api/metrics.py`, and
# `services/api/tests/test_metrics.py::test_every_alert_rule_names_a_metric_we_publish` asserts
# that — a rule that watches a metric nobody emits is a rule that will never fire, and it looks
# exactly like a rule that is not firing because everything is fine.
#
# Four of the six are ALSO raised in-process by `baskfy_worker.alerts`, at the moment the code
# learns the fact, so they carry the run id and the failing assertion rather than a threshold
# crossing. They are duplicated here because a worker that is itself down must not take the alert
# about it down as well. Deduplicate in Alertmanager on `alertname` + `trade_date`; both sources
# use the names in `baskfy_worker.alerts.AlertName`.
#
# `runbook_url` is a repo-relative path, not a URL. There is no docs site yet; the file is what
# whoever is paged actually opens.

groups:
  - name: baskfy-recording
    interval: 30s
    rules:
      # docs/11 §Reliability budgets 99.5% availability, which is the same statement as an error
      # rate below 0.5%. PROMPTS.md asks to alert above 1%. Recorded rather than inlined so the
      # Grafana panel and the alert read the same expression.
      - record: baskfy:http_error_rate:ratio5m
        expr: |
          sum(rate(baskfy_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(baskfy_http_requests_total[5m])), 0.001)

      # docs/06 §Caching exists to make the warm path cheap; the hit rate is how you know it does.
      - record: baskfy:screen_cache_hit_rate:ratio5m
        expr: |
          sum(rate(baskfy_screen_cache_events_total{result="hit"}[5m]))
          /
          clamp_min(sum(rate(baskfy_screen_cache_events_total[5m])), 0.001)

      - record: baskfy:provider_error_rate:ratio15m
        expr: |
          sum by (provider) (rate(baskfy_provider_calls_total{outcome!="ok"}[15m]))
          /
          clamp_min(sum by (provider) (rate(baskfy_provider_calls_total[15m])), 0.001)

      # docs/11 §"Performance budgets": screen run p95 < 150 ms warm, < 800 ms cold. One series,
      # because a scrape cannot tell the two apart — the cold path is the tail of this histogram.
      - record: baskfy:screen_run_latency:p95_5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(baskfy_http_request_duration_seconds_bucket{route=~".*/screens/.*run.*"}[5m])
            )
          )

  - name: baskfy-pipeline
    interval: 60s
    rules:
      - alert: pipeline_failed
        # The gauge publishes a 0 for every status the last run is *not* in, so this resolves on
        # its own once a later run succeeds. A metric that only appeared on failure would leave an
        # alert firing forever.
        expr: baskfy_pipeline_run_status{status="failed"} == 1
        for: 5m
        labels: {severity: critical, service: decile}
        annotations:
          summary: "The most recent nightly pipeline run failed."
          description: >-
            docs/03: a failed run does not bump data_version, so the site is serving the previous
            snapshot. Find the failing step in /admin/pipeline.
          runbook_url: docs/runbooks/pipeline-failed.md

      - alert: data_quality_gate_failed
        expr: baskfy_pipeline_gate_passed == 0
        for: 5m
        labels: {severity: critical, service: decile}
        annotations:
          summary: "The data-quality gate failed; today's data was not published."
          description: >-
            docs/03 step 9 is a hard gate. Read the failing assertions in the step payload before
            deciding whether the previous data_version can keep serving.
          runbook_url: docs/runbooks/bad-data-published.md

      - alert: pipeline_abandoned
        # A run still `running` well past docs/11's 45-minute end-to-end budget. This is the shape
        # a worker killed mid-pipeline leaves behind; `baskfy.ops.reap_abandoned_runs` also fails
        # it and alerts in-process, and this is the backstop for a worker fleet that is entirely
        # down and therefore cannot run the reaper either.
        expr: baskfy_pipeline_running_age_seconds > 5400
        for: 10m
        labels: {severity: critical, service: decile}
        annotations:
          summary: "A pipeline run has been in 'running' for over 90 minutes."
          description: >-
            docs/11 budgets the whole chain at 45 minutes. The worker that owned this run has
            almost certainly died; its transaction rolled back, so no step rows survive for the
            steps that had completed.
          runbook_url: docs/runbooks/pipeline-failed.md

      - alert: publish_late
        # docs/11 §Reliability: "data published by 20:15 IST on >=95% of trading days."
        # 15:30 IST close to 20:15 IST is 4h45m = 17100s. Alerting on the *age* of the last
        # publish rather than on a wall-clock time keeps the rule timezone-free: over a weekend
        # the age grows past this and the `hour()` guard is what keeps it quiet.
        expr: |
          baskfy_last_publish_age_seconds > 17100
          and on() (hour() >= 14 and hour() < 20)
          and on() (day_of_week() > 0 and day_of_week() < 6)
        for: 10m
        labels: {severity: critical, service: decile}
        annotations:
          summary: "Nothing has published since the last trading day's 20:15 IST deadline."
          description: >-
            docs/11 §Reliability SLO. `baskfy.ops.check_publish_deadline` raises the same alert
            from the worker at 20:15 IST with the trade date attached; this fires when the worker
            fleet is down and cannot.
          runbook_url: docs/runbooks/pipeline-failed.md

  - name: baskfy-service
    interval: 30s
    rules:
      - alert: api_error_rate_high
        # PROMPTS.md §3: "error rate > 1%". docs/11's 99.5% availability SLO is the tighter number;
        # 1% is the paging threshold, and the SLO is what the burn-rate dashboard tracks.
        expr: baskfy:http_error_rate:ratio5m > 0.01
        for: 5m
        labels: {severity: critical, service: decile}
        annotations:
          summary: "More than 1% of API responses are 5xx over the last five minutes."
          runbook_url: docs/runbooks/pipeline-failed.md

      - alert: queue_backlog
        # Matches BASKFY_QUEUE_BACKLOG_THRESHOLD's default. `baskfy.ops.check_queue_backlog`
        # raises the same alert from the worker with the queue named.
        expr: baskfy_queue_depth > 100
        for: 10m
        labels: {severity: warning, service: decile}
        annotations:
          summary: "Celery queue {{ $labels.queue }} has more than 100 messages waiting."
          description: >-
            docs/02 gives each workload its own queue so one cannot starve another. A backlog on
            `ingest` is usually a rate-limited or down provider; on `backtest` it is usually
            demand, and docs/03 §"Scaling plan" step 4 is the answer.
          runbook_url: docs/runbooks/pipeline-failed.md

      - alert: kite_token_expiring
        # docs/09 calls token expiry "the #1 pipeline failure". There is no Prometheus-visible
        # signal for the token's own expiry — it is computed from the stored issue time by
        # `baskfy.ops.check_kite_token`, which raises the alert directly. What *is* visible is the
        # provider giving up, which is the same incident found late.
        expr: baskfy:provider_error_rate:ratio15m{provider="kite"} > 0.5
        for: 10m
        labels: {severity: critical, service: decile}
        annotations:
          summary: "Over half of Kite calls are failing; the access token has probably expired."
          runbook_url: docs/runbooks/kite-token-expired.md

      - alert: screen_run_over_budget
        # docs/11 §"Performance budgets": cold screen run p95 < 800 ms. Not one of PROMPTS.md §3's
        # six; included because the budget is a number docs/11 states and an SLO nobody watches is
        # a wish.
        expr: baskfy:screen_run_latency:p95_5m > 0.8
        for: 15m
        labels: {severity: warning, service: decile}
        annotations:
          summary: "Screen-run p95 is above the 800 ms cold budget in docs/11."
          runbook_url: docs/runbooks/pipeline-failed.md

      - alert: baskfy_target_down
        expr: up{job=~"baskfy-.*"} == 0
        for: 5m
        labels: {severity: critical, service: decile}
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }})."
          description: >-
            Every alert above is evaluated over metrics from this target. While it is down, the
            absence of an alert means nothing.
          runbook_url: docs/runbooks/pipeline-failed.md

      # ---------------------------------------------------------------------------------------
      # M20 §1: the desk's order path. Until now this had journalctl and nothing else, which is
      # why the incidents these evaluate over were all found by reading a log after the fact.
      # Every one of them is a real event from 18-19 Aug 2026, not a hypothetical.
      # ---------------------------------------------------------------------------------------
      - alert: desk_orders_failing_systemically
        # 18 Aug 2026: twenty-one orders fired into the same "No IPs configured for this app"
        # rejection because nothing noticed the first three had failed identically. The desk now
        # has a circuit breaker; this is the alert that says the breaker tripped.
        expr: increase(desk_guard_refusals_total{guard="circuit_breaker"}[10m]) > 0
        for: 0m
        labels: {severity: critical, service: desk}
        annotations:
          summary: "A rebalance batch was stopped by the circuit breaker — three identical failures."
          description: >-
            The batch is half-executed by definition: orders before the trip went to the broker
            and the rest did not.
          runbook_url: docs/runbooks/rebalance-half-executed.md

      - alert: desk_orders_rejected
        expr: increase(desk_orders_total{outcome=~"REJECTED|FAILED|RISK_BLOCKED|BLOCKED"}[15m]) > 0
        for: 0m
        labels: {severity: warning, service: desk}
        annotations:
          summary: "{{ $value }} order(s) were rejected or blocked in the last fifteen minutes."
          runbook_url: docs/runbooks/rebalance-half-executed.md

      - alert: desk_buys_without_stops
        # Non-negotiable rule 4: every buy gets a stop the same session. Stops are armed from
        # /stops after fills are known, so this compares the session's buys against the session's
        # GTTs rather than expecting them to be simultaneous.
        expr: >-
          increase(desk_orders_total{action="BUY",outcome="COMPLETE"}[6h])
          > increase(desk_gtt_total{outcome!="CANCELLED"}[6h])
        for: 30m
        labels: {severity: critical, service: desk}
        annotations:
          summary: "More buys completed today than stops were armed. Rule 4 is not satisfied."
          description: >-
            An unstopped position is the one failure mode the desk's own rules single out. Arm
            the missing triggers from /stops.
          runbook_url: docs/runbooks/rebalance-half-executed.md

      - alert: desk_execute_slow
        # A batch that takes minutes is a batch whose limit prices are going stale while it runs.
        expr: histogram_quantile(0.95, rate(desk_execute_seconds_bucket[30m])) > 120
        for: 0m
        labels: {severity: warning, service: desk}
        annotations:
          summary: "An execute batch took over two minutes at p95 — limit prices may be stale."
          runbook_url: docs/runbooks/rebalance-half-executed.md

  # -------------------------------------------------------------------------------------------
  # SW11: the swing book (docs/swing/06 SW11; docs/swing/STANDING-ANSWERS B8). Every metric
  # here is a database-derived gauge `baskfy_api.metrics.refresh_swing_metrics` re-reads from
  # `baskfy_api.swing_health` on each scrape, and `services/api/tests/test_swing_alerts.py`
  # evaluates each rule from a synthetic series with the API's own gauges — the rule grammar is
  # deliberately small (a gauge comparison, an IST window written in UTC minutes-of-day, a
  # weekday guard) so that test can evaluate it exactly. `baskfy_worker.tasks.swing_ops` raises
  # the same four time-of-day alerts in-process at the moment each is about.
  #
  # `hour()`/`minute()` are UTC in PromQL; the windows are IST converted: 09:20 = 230,
  # 10:45 = 315, 10:50 = 320, 15:20 = 590, 15:30 = 600, 21:00 = 930, 21:30 = 960, 23:30 = 1080.
  # -------------------------------------------------------------------------------------------
  - name: baskfy-swing
    interval: 60s
    rules:
      - alert: SWING_POSITION_NAKED
        # A8 / non-negotiable 4: no filled quantity without a GTT. Any time: the confirm arms
        # the stop in the same request, so ten minutes of a naked position means the arm was
        # refused and nobody has pressed "Re-arm GTT" on the desk page.
        expr: baskfy_swing_naked_positions > 0
        for: 10m
        labels: {severity: warning, service: swing}
        annotations:
          summary: "{{ $value }} swing position(s) have shares open and no resting GTT."
          runbook_url: docs/runbooks/06-swing-morning.md

      - alert: SWING_MONITOR_DID_NOT_START
        # 09:20 IST with the flag on and no `sw_session.monitor_ran` for today. The monitor
        # writes the row on its first tick (SW11), so this reads a fact and not the 10:45 outcome.
        # Quiet after 10:45 — a monitor that never ran is then the evening's problem.
        expr: |
          baskfy_swing_monitor_enabled == 1
          and on() baskfy_swing_monitor_ran_today == 0
          and on() (hour() * 60 + minute()) >= 230
          and on() (hour() * 60 + minute()) < 315
          and on() (day_of_week() > 0 and day_of_week() < 6)
        for: 5m
        labels: {severity: critical, service: swing}
        annotations:
          summary: "BASKFY_SWING_MONITOR_ENABLED is true and the opening-range monitor has not started."
          runbook_url: docs/runbooks/06-swing-morning.md

      - alert: SWING_DETECT_STALE
        # No `sw_market_daily` for the published date by 21:30 IST: the detect step (the
        # chain's twelfth, and the 21:00 belt) has not run, and the 21:05 evening job will plan
        # against a stale gate. Quiet from 23:30 IST — by then it is the morning's problem.
        expr: |
          baskfy_swing_detect_ran_for_published_date == 0
          and on() (hour() * 60 + minute()) >= 960
          and on() (hour() * 60 + minute()) < 1080
          and on() (day_of_week() > 0 and day_of_week() < 6)
        for: 15m
        labels: {severity: critical, service: swing}
        annotations:
          summary: "The swing detect step has not run for the published trade date."
          runbook_url: docs/runbooks/06-swing-morning.md

      - alert: SWING_ORDER_OPEN_AFTER_CUTOFF
        # A8: the 10:45 cutoff cancels every open remainder. A BUY line still SENT at 10:50 IST
        # means the cutoff did not run or the cancel was refused (`sw_plan_line.note` says).
        expr: |
          baskfy_swing_open_buy_orders_today > 0
          and on() (hour() * 60 + minute()) >= 320
          and on() (hour() * 60 + minute()) < 600
          and on() (day_of_week() > 0 and day_of_week() < 6)
        for: 5m
        labels: {severity: critical, service: swing}
        annotations:
          summary: "{{ $value }} swing buy order(s) still open after the 10:45 cutoff."
          runbook_url: docs/runbooks/06-swing-morning.md

      - alert: SWING_GTT_MISSING_AT_1515
        # A8: the 15:15 sweep re-arms whatever is naked. Naked at 15:20 IST means the sweep did
        # not run or could not arm (no last price, a refused GTT) — the book is going into the
        # close unprotected, and this is the page, not the warning above. A GTT can be armed
        # after hours, so the page stays up until 21:00 IST (930) while the fact holds.
        expr: |
          baskfy_swing_naked_positions > 0
          and on() (hour() * 60 + minute()) >= 590
          and on() (hour() * 60 + minute()) < 930
          and on() (day_of_week() > 0 and day_of_week() < 6)
        for: 2m
        labels: {severity: critical, service: swing}
        annotations:
          summary: "{{ $value }} swing position(s) still without a GTT after the 15:15 sweep."
          runbook_url: docs/runbooks/06-swing-morning.md
