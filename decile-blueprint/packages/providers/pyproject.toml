[project]
name = "baskfy-providers"
version = "0.1.0"
description = "Baskfy market-data provider adapters (Kite, NSE, fixtures)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "baskfy-core",
    # Prompt 2 §2: "using the official kiteconnect client".
    "kiteconnect>=5.0",
    # Prompt 2 §2: the access token is "stored encrypted (Fernet)".
    "cryptography>=43.0",
    # docs/02 locks Redis 7; Prompt 2 §2 wants the token bucket "shared across processes".
    "redis>=5.2",
    # docs/02 locks Cloudflare R2; Prompt 2 §3 archives every raw NSE file to it before parsing.
    "boto3>=1.35",
    # NSE's public files need a browser-like session with a cookie jar (docs/09 "NSE specifics").
    # Not named in docs/02 — the one discretionary dependency in this module.
    "httpx>=0.28",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baskfy_providers"]

[tool.uv.sources]
baskfy-core = { workspace = true }
