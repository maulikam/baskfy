[project]
name = "baskfy"
version = "0.1.0"
description = "Baskfy — India-equities momentum screener (workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "baskfy-core",
    "baskfy-api",
    "baskfy-providers",
    "baskfy-worker",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "packages/execution", "packages/providers", "services/api", "services/worker"]

[tool.uv.sources]
baskfy-core = { workspace = true }
baskfy-execution = { workspace = true }
baskfy-api = { workspace = true }
baskfy-providers = { workspace = true }
baskfy-worker = { workspace = true }

[dependency-groups]
dev = [
    "baskfy-execution",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.112",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests>=2.32",
    # docs/07 acceptance criteria: "Contract tests for every endpoint using httpx".
    "httpx>=0.28",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    "pandas>=2.2",
    "pandas-stubs>=2.2",
]

# ---------------------------------------------------------------------------
# Tooling (shared by every workspace member)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/core/src", "packages/providers/src", "services/api/src", "services/worker/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF", "TID", "PL"]
ignore = []

[tool.ruff.format]
# THE FORMATTER DOES NOT TOUCH THE MOVED EXPOSURE OVERLAY, AND THAT RULE WAS PAID FOR.
#
# These two files are byte-identical to code that has been deciding this book's equity sleeve, and
# M15's acceptance is that they did not change. A repo-wide `ruff check --fix` plus `ruff format`
# rewrote 509 lines of them in one command -- reflowing frozensets, rewriting quoted annotations,
# moving Iterable/Mapping/Sequence from typing to collections.abc, and deleting a `replace` import
# it judged unused because the only consumers reach it through the desk's star re-export. Five desk
# tests went red and the cause was a formatter, not a decision.
#
# They are excluded from formatting, not from linting: `ruff check` still reads them, with the
# rules that would demand restructuring scoped in per-file-ignores below and its reasons given
# there. Whoever types these properly (docs/DECISIONS-MERGE.md M15.6) can lift this.
exclude = [
    "packages/core/src/baskfy_core/exposure/*.py",
    "packages/execution/src/baskfy_execution/*.py",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004"]
# Same reason as the line above, for the reconciliation tests that sit outside a tests/ directory:
# in a test the literal IS the specification, and naming it costs the reader the number.
"reconciliation/test_*.py" = ["PLR2004"]
# Prompt 19 §3's pandas oracle is deliberately one flat transcription of docs/05, section by
# section, with no helpers of its own. Splitting it to satisfy the branch and statement limits
# would introduce exactly the shared abstraction an oracle exists to avoid: the value of the
# cross-validation is that the two implementations have no structure in common.
"packages/core/tests/factor_oracle.py" = ["PLR0912", "PLR0915"]
"services/api/alembic/versions/*" = ["E501"]
# The Momentum Quality Score, ported from the desk at M15 and byte-identical to the pipeline the
# live account was traded on. Its thresholds ARE the strategy -- RSI over 82, volatility over 0.55,
# extension over 25% -- and they are specified that way in
# kite-momentum-rebalancer/.claude/skills/momentum-rebalance/SKILL.md. Lifting each to a named
# constant would be a rewrite of the one file whose whole point is that it did not change, and it
# would put the numbers a step further from the spec that defines them.
"packages/core/src/baskfy_core/score.py" = ["PLR2004"]
# The exposure overlay, moved from the desk at M15 and byte-identical to the code that has been
# deciding this book's equity sleeve. regime.py is one long spec transcription: mutually exclusive
# tier rules evaluated R4 -> R3 -> R1 -> else R2, each a named threshold from the regime spec, and
# the solver in allocation.py takes the whole decision as parameters on purpose so that live
# evaluation and historical replay call it identically. Splitting either to satisfy branch,
# statement or argument limits would restructure validated trading logic to please a counter --
# and the counters are what would be satisfied, not the reader.
#
# The cosmetic rules are scoped too, and deliberately. These files are byte-identical to code that
# has been sizing real orders; reflowing a display-string table or rewriting `int(round(qty))` to
# satisfy a counter buys no reader anything and risks a typo in arithmetic that decides how many
# shares get bought. The same argument the alembic E501 exemption above already makes.
"packages/core/src/baskfy_core/exposure/*.py" = [
    "PLR0912",  # too many branches: the tier rules are a flat decision table
    "PLR0913",  # too many arguments: every input is explicit, which is the point
    "PLR0915",  # too many statements: same
    "PLR2004",  # the thresholds ARE the spec
    "UP042",    # str+Enum, not StrEnum: changing an enum's base in live trading logic
                # is a behaviour risk with no reader benefit
    "E501",     # a Reason -> sentence table, one line per reason
    "RUF005",
    "RUF046",
    "F841",    # three dead locals; reported in DECISIONS-MERGE M15.6, not silently deleted
    "F401",    # `replace` looks unused here and is re-exported by the desk's shim
    "SIM114",  # merging two tier branches would hide which rule fired
    "UP035",   # typing.Iterable/Mapping/Sequence: modernising them edits the file
    "UP037",   # quoted annotations: same
]
"packages/core/src/baskfy_core/basket.py" = ["PLR0912", "PLR0913", "PLR0915", "PLR2004"]
# The order path, moved verbatim from the desk at M16. Same argument as the exposure overlay: this
# is code that has been placing this account's orders, its acceptance criterion is that it did not
# change, and annotating or restructuring it to satisfy a counter is a change to the module that
# talks to a broker. It is LINTED -- these are the rules that would require editing it, each named.
"packages/execution/src/baskfy_execution/*.py" = [
    "ANN001", "ANN201", "ANN202", "ANN204",  # missing annotations: see the mypy override below
    "E401",     # `import asyncio, json, os, time, uuid, logging` on one line, as it was
    "I001",     # import order, as it was
    "PLR0911",  # many returns: each is a named refusal, and collapsing them loses the reason
    "PLR0913",  # place() takes every order parameter explicitly, which is the point
    "UP035",
]

# The three modules moved from the desk at M15 (P3.1-P3.3). They are byte-identical to code that
# has been scoring and sizing a live book, and they arrived from a tree with no type checker at
# all, so mypy strict has never seen them.
#
# Typing them properly is worth doing and it is NOT a rename-and-annotate job: `dict[str, object]`
# on one return took the error count from 26 to 50, because narrowing a payload's type surfaces
# every downstream access at once. Doing it honestly means giving the plan, the regime state and
# the allocation real shapes -- TypedDicts or dataclasses -- across roughly 1,900 lines whose
# acceptance criterion this module is that they did not change.
#
# So: checked, not ignored. `disallow_untyped_defs` and the rest still apply; what is relaxed is
# the strictness that only bites because the payloads are untyped dicts today. Recorded in
# docs/DECISIONS-MERGE.md M15.6 with the work it defers.
[[tool.mypy.overrides]]
module = [
    "baskfy_core.score",
    "baskfy_core.basket",
    "baskfy_core.exposure.*",
    "baskfy_execution.*",
]
disallow_any_expr = false
warn_return_any = false
# `no-untyped-def` / `no-untyped-call` are here for baskfy_execution specifically: the four order-path
# modules arrived from a tree with no type checker, and annotating them means editing code whose
# acceptance criterion is that it did not change. Everything else mypy checks about them still
# applies. Typing them is real work with real value and it is recorded as debt, not skipped
# silently -- docs/DECISIONS-MERGE.md M16.3, alongside the same debt from M15.
disable_error_code = [
    "type-arg", "operator", "arg-type", "func-returns-value",
    "no-untyped-def", "no-untyped-call",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# NOT set: disallow_any_explicit. The pydantic mypy plugin synthesises `__init__(**data: Any)`
# on every model, so the flag fires on our own class statements and cannot be satisfied. The
# house rule "no `any`" is enforced instead by ruff's ANN401 and by
# packages/core/tests/test_no_escape_hatches.py, which scan our source rather than generated code.
plugins = ["pydantic.mypy"]
mypy_path = "packages/core/src:packages/core/tests:packages/execution/src:packages/providers/src:packages/providers/tests:services/api/src:services/api/tests:services/worker/src:services/worker/tests"
explicit_package_bases = true
# NOTE: `conftest.py` files are excluded below. Each test tree is a mypy base (so that its
# sibling helper module — `stubs`, `helpers` — resolves), which makes every conftest the
# top-level module `conftest`, and they collide. Fixtures live in conftest; everything with logic
# worth checking lives in the helper modules and in `network_guard.py`, which are checked.
# `apps/web/brand-src/` is a build-time script, not part of any package. It imports Pillow and
# NumPy, which are deliberately NOT project dependencies: it is run once when the logo changes,
# via `uv run --with pillow --with numpy`, so that a raster tool nothing at runtime needs stays
# out of the locked stack (house rule 1). mypy cannot resolve those imports and there is nothing
# to gain by teaching it to — the alternative would be a `# type: ignore`, which house rule 3
# forbids. Excluded here, with the reason, rather than silenced at the import site.
exclude = ["(^|/)conftest\\.py$", "^apps/web/brand-src/"]
files = [
    "network_guard.py",
    "packages/execution/src",
    # Prompt 19's repo-level tooling: the per-package coverage gate and the mutation harness.
    # `benchmarks/` predates this list and is checked by ruff only.
    "tools",
    "packages/core/src",
    "packages/core/tests",
    "packages/providers/src",
    "packages/providers/tests",
    "services/api/src",
    "services/api/tests",
    "services/worker/src",
    "services/worker/tests",
]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

# kiteconnect ships no py.typed marker and no stubs. baskfy_providers.kite therefore declares a
# `KiteClientLike` Protocol covering exactly the calls we make, and translates the vendor's
# exceptions at its own boundary, so the untyped surface stops there.
[[tool.mypy.overrides]]
module = ["kiteconnect.*"]
ignore_missing_imports = true

# boto3 ships no inline types. The `boto3-stubs` package models every S3 operation with generated
# `Unpack[TypedDict]` signatures, which by construction cannot satisfy a narrow structural
# Protocol — and the narrow Protocol is the thing we actually want to depend on, since
# baskfy_providers.archive uses exactly three S3 calls. So: no stubs, and `S3ClientLike` in
# baskfy_providers.archive is the contract that gets type-checked.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

# celery ships no py.typed marker, so `@shared_task` is an untyped decorator. The work each task
# wraps lives in a fully typed `run_*` coroutine beside it; only the thin binding is affected.
[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

# `opentelemetry-instrumentation-celery` ships no `py.typed` either, so `CeleryInstrumentor()` is
# an untyped call. It is invoked in exactly two places — `baskfy_api.telemetry.configure_telemetry`
# and `baskfy_worker.telemetry.install_worker_observability` — and both are one line that installs
# a library patch and returns nothing. The alternative is a `# type: ignore`, which CLAUDE.md
# house rule 3 forbids outright.
[[tool.mypy.overrides]]
module = ["opentelemetry.instrumentation.celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["baskfy_api.telemetry", "baskfy_worker.telemetry"]
disallow_untyped_calls = false

# `celery.signals.worker_process_init.connect` is an untyped decorator, exactly like
# `@shared_task` above and for the same reason.
[[tool.mypy.overrides]]
module = ["baskfy_worker.celery_app"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["baskfy_worker.tasks.celery_tasks"]
disallow_untyped_decorators = false

# M19 §1. Same reason as the two above: `@app.task` is untyped in celery's stubs, so every task it
# decorates reads as untyped no matter how the function itself is annotated.
[[tool.mypy.overrides]]
module = ["baskfy_worker.tasks.desk"]
disallow_untyped_decorators = false

# M22. `baskfy_api.baskets` imports the desk's `app.config` so the web app cannot show a basket
# scored differently from the one the desk trades. The desk is a sibling checkout with its own
# virtualenv, not a workspace package, so mypy has no stubs for it -- the alternative is
# restating the score weights here, which is the failure this import exists to prevent.
[[tool.mypy.overrides]]
module = ["app.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "packages/core/tests",
    # Absent until M16 follow-up: `packages/execution` is law #2's "only path to an order",
    # and its suite was never collected by `make test`. An ImportError sat in `adapters.py`
    # from ef50c09 until it was found by the GTT port, because nothing ran it.
    "packages/execution/tests",
    "packages/providers/tests",
    "services/api/tests",
    "services/worker/tests",
    # M27's measurement lives beside the module it verifies rather than in a package's tests/
    # directory, because it is about a reconciliation artifact and not about a package. Without
    # this line it was collected by nothing and ran only when named explicitly -- which is the
    # same as not existing.
    "reconciliation",
]
addopts = "-q --strict-markers --strict-config"
markers = [
    "db: test requires a live PostgreSQL+TimescaleDB instance (BASKFY_TEST_DATABASE_URL)",
    "redis: test requires a live Redis instance (BASKFY_REDIS_URL); `make up` provides one",
    "benchmark: measures a docs/11 performance budget rather than asserting behaviour",
]

[tool.coverage.run]
branch = true
source = ["baskfy_core", "baskfy_api", "baskfy_providers", "baskfy_worker"]

