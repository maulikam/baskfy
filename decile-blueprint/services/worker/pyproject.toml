[project]
name = "baskfy-worker"
version = "0.1.0"
description = "Decile Celery workers, Beat schedule and the nightly pipeline."
requires-python = ">=3.12,<3.13"
dependencies = [
    "baskfy-core",
    "baskfy-api",
    "baskfy-providers",
    # docs/02 §"The decision in one table": Celery + Celery Beat, `flower` for inspection.
    "celery[redis]>=5.4",
    "flower>=2.0",
    # docs/02 §Observability + PROMPTS.md Prompt 17 §1: "OpenTelemetry traces across web -> API
    # -> worker -> database". The worker end of that chain is a Celery message, and this is the
    # instrumentor that reads the W3C `traceparent` the API put on it — without it a pipeline span
    # is a new trace rather than a continuation of the request that enqueued it.
    "opentelemetry-instrumentation-celery>=0.49b0",
    # M19 §1 + §3. The worker runs the desk's collection jobs (`baskfy_worker.tasks.desk`), and
    # the desk reads its own records through `app/analytics/pg.py`, which is synchronous psycopg
    # rather than the asyncpg the API uses. Without it the Beat task fails at 18:30 with
    # ModuleNotFoundError -- which is how the M19 test suite found this.
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baskfy_worker"]

[tool.uv.sources]
baskfy-core = { workspace = true }
baskfy-api = { workspace = true }
baskfy-providers = { workspace = true }
