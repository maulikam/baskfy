[project]
name = "baskfy-worker"
version = "0.1.0"
description = "Baskfy Celery workers, Beat schedule and the nightly pipeline."
requires-python = ">=3.12,<3.13"
dependencies = [
    "baskfy-core",
    "baskfy-api",
    "baskfy-providers",
    # Imported directly by kite_session_cli to verify a pulled session against Kite.
    "httpx>=0.28",
    # docs/02 §"The decision in one table": Celery + Celery Beat, `flower` for inspection.
    "celery[redis]>=5.4",
    "flower>=2.0",
    # docs/02 §Observability + PROMPTS.md Prompt 17 §1: "OpenTelemetry traces across web -> API
    # -> worker -> database". The worker end of that chain is a Celery message, and this is the
    # instrumentor that reads the W3C `traceparent` the API put on it — without it a pipeline span
    # is a new trace rather than a continuation of the request that enqueued it.
    "opentelemetry-instrumentation-celery>=0.49b0",
    # M19 §1 + §3. The worker used to run the desk's collection jobs (`baskfy_worker.tasks.desk`);
    # those now run in the desk-daily container (NEEDS-MAULIK §33). psycopg stays: the desk
    # reads its own records through `app/analytics/pg.py`, which is synchronous psycopg
    # rather than the asyncpg the API uses, and leftover `baskfy.desk.*` stubs still import
    # that path on this worker.
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baskfy_worker"]

[tool.uv.sources]
baskfy-core = { workspace = true }
baskfy-api = { workspace = true }
baskfy-providers = { workspace = true }
