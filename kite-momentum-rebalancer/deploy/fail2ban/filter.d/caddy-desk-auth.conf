# Failed Basic-auth attempts against the desk, read from the Caddy JSON access log.
# A legitimate first visit produces exactly one 401 - the browser is challenged, then
# retries with credentials and sends them proactively thereafter. So a handful of 401s
# is a person arriving; a stream of them is somebody working through a wordlist.
#
# THE DATEPATTERN IS LOAD-BEARING. Caddy writes its timestamp as a bare epoch float
# ("ts":1787157417.79), which fail2ban cannot parse with any default template. Without
# it every line matches the failregex and is then discarded as undated, so the jail
# reports itself enabled, counts zero failures forever, and bans nobody.
[Definition]
failregex = ^.*"remote_ip":"<HOST>".*"status":401.*$
ignoreregex =
journalmatch =

[Init]
datepattern = "ts":{EPOCH}
