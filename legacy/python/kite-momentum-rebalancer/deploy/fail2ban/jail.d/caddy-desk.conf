[caddy-desk-auth]
enabled  = true
filter   = caddy-desk-auth
port     = http,https
logpath  = /var/log/caddy/desk.log
# BACKEND IS LOAD-BEARING. jail.d/defaults-debian.conf sets backend = systemd for every
# jail on this distribution, and under that backend logpath is ignored entirely - the
# jail loads, reports itself enabled, monitors no file and bans nobody. Caddy writes to
# a file, not the journal, so this jail has to read a file.
backend  = polling
maxretry = 10
findtime = 600
bantime  = 3600
