[package]
name = "baskfy-desk"
version = "0.1.0"
description = "Baskfy's operator desk (axum), ported from kite-momentum-rebalancer/app: the settings, storage, template engine, Kite and gateway interfaces, and one module per porting lane."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "baskfy-desk"
path = "src/main.rs"

[dependencies]
baskfy-core = { workspace = true }
baskfy-providers = { workspace = true }
# The generated scan (lanes/weekly/scan_source.rs) builds the bar frame `baskfy_core::factors`
# takes; computation only, the workspace's IO-free features (DECISIONS-RS R8.WP1).
polars = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true }
# "sqlite": the desk's tests and a laptop desk run on SQLite (app/analytics/db.py); additive to
# the workspace's Postgres features (DECISIONS-RS R8.2).
sqlx = { workspace = true, features = ["sqlite"] }
serde = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
minijinja = { workspace = true }
minijinja-contrib = { workspace = true }
md-5 = { workspace = true }
httpdate = { workspace = true }
futures-util = { workspace = true }
# The swing notifier's transports (DECISIONS-RS R8.SM3): Telegram's sendMessage over reqwest, the
# relay's STARTTLS over tokio-rustls with the webpki roots.
reqwest = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }

[lints]
workspace = true
