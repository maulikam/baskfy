[package]
name = "baskfy-providers"
version = "0.1.0"
description = "Baskfy's market-data adapters (Kite, NSE, fixtures), ported from decile-blueprint/packages/providers (baskfy_providers)."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# The Python package imports baskfy_core (models, universes, tradebook, reference_export).
baskfy-core = { workspace = true }
# dtype-decimal: DAILY_BARS_SCHEMA and BHAVCOPY_SCHEMA are Decimal(18,4) columns. csv/json:
# NSE's parsers are pl.read_csv / pl.read_json over in-memory bytes (DECISIONS-RS R4.2). Declared
# here, never on the workspace pin that baskfy-core reads (law_one.rs).
polars = { workspace = true, features = ["dtype-decimal", "csv", "json"] }
rust_decimal = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
redis = { workspace = true }
async-trait = { workspace = true }
fernet = { workspace = true }
rand = { workspace = true }
rustix = { workspace = true }
zip = { workspace = true }
csv = { workspace = true }
regex = { workspace = true }
percent-encoding = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }

[lints]
workspace = true
