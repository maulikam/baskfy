# Opportunities (AI Ask panel) stays on Python while api runs on Rust: a strangler sidecar.
# local.sh copies this beside compose.prod.yml; Caddy sends /api/v1/opportunities/* here.
# Remove the file (and recreate caddy) when the Rust API serves /opportunities.
services:
  api-py:
    image: ${BASKFY_OPPS_PY_IMAGE:-baskfy-py:opps-ai}
    restart: unless-stopped
    env_file: [.env.staging]
    environment: {TZ: Asia/Kolkata}
    command: [uvicorn, "baskfy_api.app:get_app", --factory, --host=0.0.0.0, --port=8000, --workers=1, --proxy-headers, "--forwarded-allow-ips=*"]
    expose: ["8000"]
    depends_on: [postgres, redis]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
  caddy:
    environment: {BASKFY_OPPS_UPSTREAM: "api-py:8000"}
